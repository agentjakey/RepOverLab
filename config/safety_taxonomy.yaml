safety_bands:
  benign:
    label: "Benign"
    short: "Benign"
    description: >-
      Educational content, professional knowledge, and general information with
      no meaningful path to harm. These examples represent what safety systems
      should never suppress - the baseline of legitimate discourse.
    color: "#4E8098"
    marker: "circle"

  capability_building:
    label: "Capability-Building"
    short: "Cap.-Building"
    description: >-
      Technical or specialized knowledge with clear, primary legitimate uses in
      professional, academic, or educational contexts. The information is factual
      and grounded; the concern arises only with deliberate misapplication, not
      from the information itself.
    color: "#9B7EBD"
    marker: "circle"

  ambiguous:
    label: "Ambiguous"
    short: "Ambiguous"
    description: >-
      Genuinely uncertain cases where classification depends on intent, context,
      and audience in ways the embedding model cannot distinguish. These examples
      sit at real category boundaries and illustrate why rule-based filtering
      produces both false positives and false negatives.
    color: "#D4A853"
    marker: "diamond"

  policy_relevant_sanitized:
    label: "Policy-Relevant (Sanitized)"
    short: "Policy/Sanitized"
    description: >-
      Sensitive topics presented in a policy, research, or analytical framing
      without operational detail. These examples are the kind of text that
      appears in academic papers, congressional testimony, and investigative
      journalism - necessary for informed governance, but sitting in semantic
      proximity to more directly risky content.
    color: "#C47C5A"
    marker: "circle"

  abstract_risk_placeholder:
    label: "Abstract Risk Placeholder"
    short: "Abstract Risk"
    description: >-
      Named references to categories of disallowed content, written at the
      level of abstraction - what the category is and why it is excluded -
      without any operational detail. These entries exist in the dataset to show
      that restricted content clusters exist and that legitimate content sits
      near them, making over-restriction a predictable failure mode.
    color: "#7B4B44"
    marker: "diamond"

domains:
  biology:
    label: "Biology"
    description: >-
      Life sciences: genetics, virology, cell biology, ecology, and related
      research. Biology education borders biosecurity governance at multiple
      points - the dual-use concern in biology is among the most serious in
      any scientific domain.

  cybersecurity:
    label: "Cybersecurity"
    description: >-
      Computer security, network defense, vulnerability research, and digital
      forensics. Cybersecurity is structurally dual-use: defensive understanding
      and offensive capability require the same underlying knowledge.

  persuasion:
    label: "Persuasion"
    description: >-
      The psychology of influence, communication, and belief change. Persuasion
      research is foundational to advertising, public health, and political
      communication - and the same knowledge underlies manipulation and
      disinformation.

  physics:
    label: "Physics"
    description: >-
      Physical sciences including nuclear, quantum, and electromagnetic phenomena.
      Physics education touches on dual-use concerns primarily in nuclear and
      radiological domains, and in energy and weapons policy.

  AI_agents:
    label: "AI Agents"
    description: >-
      Machine learning systems, language models, autonomous agents, and AI
      safety research. AI capability development and AI misuse potential are
      difficult to disentangle at the technical level.

  governance:
    label: "Governance"
    description: >-
      Policy frameworks, regulatory systems, international agreements, and
      institutional mechanisms for managing risk. Governance analysis sits
      near evasion analysis in representation space.

  education:
    label: "Education"
    description: >-
      Learning, curriculum design, media literacy, and the pedagogy of sensitive
      topics. Education about harmful content is necessary for prevention, but
      shares vocabulary with the content itself.

  medicine:
    label: "Medicine"
    description: >-
      Clinical medicine, pharmacology, psychiatry, and public health. Medical
      education includes content about drug toxicity, self-harm assessment, and
      clinical risk - all of which border safety-sensitive territory.

  climate:
    label: "Climate"
    description: >-
      Climate science, energy policy, infrastructure resilience, and environmental
      governance. Climate discussion intersects with critical infrastructure risk,
      geopolitical instability, and contested policy.

  law_policy:
    label: "Law & Policy"
    description: >-
      Legal systems, regulatory frameworks, surveillance law, and criminal justice.
      Legal analysis necessarily discusses the structure of prohibited conduct in
      order to define and enforce it.

framings:
  educational:
    label: "Educational"
    description: >-
      Content oriented toward explaining or teaching a concept. The primary
      purpose is comprehension, not operational guidance.

  technical:
    label: "Technical"
    description: >-
      Content that describes mechanisms, systems, or processes in technical detail.
      Technical framing is common in both legitimate research and in content that
      enables harm.

  casual:
    label: "Casual"
    description: >-
      Conversational or informal language, as one might use in everyday communication.
      Casual framing often lacks the institutional context that signals legitimate use.

  fictional:
    label: "Fictional"
    description: >-
      Content presented as part of a story, hypothetical, or creative scenario.
      Fictional framing does not change the semantic neighborhood of the content.

  policy:
    label: "Policy"
    description: >-
      Content oriented toward governance, regulation, or institutional decision-making.
      Policy framing indicates analytical rather than operational intent, but shares
      vocabulary with the analysis of what is being governed.

  reflective:
    label: "Reflective"
    description: >-
      Content that examines the implications, tensions, or second-order effects of
      a topic rather than describing the topic itself. Reflective framing is common
      in academic and philosophical contexts.

  abstract_placeholder:
    label: "Abstract Placeholder"
    description: >-
      Content that names a disallowed category without providing operational detail.
      This framing is used exclusively for abstract_risk_placeholder entries.

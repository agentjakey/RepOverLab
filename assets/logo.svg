<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect width="120" height="120" fill="#FAFAF8" rx="8"/>

  <!-- Clearly benign cluster -->
  <circle cx="72" cy="35" r="7" fill="#4E8098" opacity="0.85"/>
  <circle cx="83" cy="28" r="5" fill="#4E8098" opacity="0.75"/>
  <circle cx="65" cy="26" r="6" fill="#4E8098" opacity="0.80"/>

  <!-- Dual use cluster -->
  <circle cx="60" cy="52" r="6" fill="#9B7EBD" opacity="0.85"/>
  <circle cx="72" cy="48" r="5" fill="#9B7EBD" opacity="0.75"/>
  <circle cx="54" cy="44" r="5" fill="#9B7EBD" opacity="0.80"/>

  <!-- Context dependent - bridging -->
  <polygon points="47,62 54,50 60,62" fill="#D4A853" opacity="0.82"/>
  <polygon points="38,68 45,56 51,68" fill="#D4A853" opacity="0.72"/>

  <!-- Sensitive legitimate -->
  <circle cx="36" cy="52" r="6" fill="#C47C5A" opacity="0.82"/>
  <circle cx="28" cy="62" r="5" fill="#C47C5A" opacity="0.72"/>
  <circle cx="42" cy="44" r="4" fill="#C47C5A" opacity="0.78"/>

  <!-- Out of scope abstract -->
  <polygon points="24,78 31,66 38,78" fill="#7B4B44" opacity="0.80"/>
  <polygon points="16,86 23,74 30,86" fill="#7B4B44" opacity="0.70"/>

  <!-- Subtle connecting lines showing overlap -->
  <line x1="60" y1="52" x2="47" y2="62" stroke="#D4A853" stroke-width="0.8" opacity="0.35"/>
  <line x1="47" y1="62" x2="36" y2="52" stroke="#C47C5A" stroke-width="0.8" opacity="0.35"/>
  <line x1="36" y1="52" x2="24" y2="78" stroke="#7B4B44" stroke-width="0.8" opacity="0.25"/>
  <line x1="72" y1="35" x2="60" y2="52" stroke="#9B7EBD" stroke-width="0.8" opacity="0.30"/>
</svg>
